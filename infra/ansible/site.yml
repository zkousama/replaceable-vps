# The configured state of the machine. Run it whenever anything in here
# changes, and run it twice when you do. If the second run reports changed=0
# the roles are idempotent; if it does not, one of them is rewriting a file on
# every pass, and a snapshot of this machine will carry whatever that is.
#
#   ansible-playbook site.yml -l prod
#
- name: Configure the host
  hosts: all
  become: true
  gather_facts: true

  roles:
    - base
    - ssh
    - firewall
    - fail2ban
    - auto-updates
    - docker
