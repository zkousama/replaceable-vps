[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = True
# Diffs on, so a run says what it changed rather than just that it changed.
# Idempotence is the only real test a playbook has: a second run on an
# unchanged host must report changed=0, and you cannot read that without this.
stdout_callback = yaml
callbacks_enabled = profile_tasks
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
