[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = True
# Diffs on, so a run says what it changed rather than just that it changed.
# Idempotence is the only real test a playbook has: a second run on an
# unchanged host must report changed=0, and you cannot read that without this.
# ansible.builtin.default with result_format, not the community.general.yaml
# callback: that one was removed in community.general 12 and a config naming it
# fails before the first task runs. --syntax-check does not load callbacks, so
# it passes on a config that cannot run.
stdout_callback = default
result_format = yaml
callbacks_enabled = profile_tasks
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
