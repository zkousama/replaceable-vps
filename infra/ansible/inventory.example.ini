; Copy to inventory.ini, which is gitignored.
;
; The line for the host comes out of the IaC: `tofu output -raw inventory_line`
; writes the address and the port, so neither is copied by hand.
;
; During bootstrap the port is still 22 and the user is still root. Both
; arguments are on the command line in that one case rather than in here, so
; this file always describes the machine's configured state.

[production]
prod ansible_host=203.0.113.10 ansible_port=2202

[all:vars]
ansible_user=ops
