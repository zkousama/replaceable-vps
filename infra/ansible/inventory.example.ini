; Copy to inventory.ini, which is gitignored.
;
; The line for the host comes out of the IaC: `tofu output -raw inventory_line`
; writes the address and the port, so neither is copied by hand.
;
; Only the address and the port. The user comes from each playbook, because
; ansible_user set here would outrank both the play's own remote_user and -u on
; the command line, and bootstrap.yml needs to connect as root for its first
; play and as ops for its second.
;
; The port is still pinned here, and bootstrap overrides it with -e for the one
; run that has to reach a fresh machine on 22.

[production]
prod ansible_host=203.0.113.10 ansible_port=2202
